<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beat API</title>
<style>
  :root {
    --bg: #0d0d10;
    --panel: #15151a;
    --line: #26262e;
    --text: #e8e8ec;
    --dim: #8a8a96;
    --accent: #ff4d6d;
    --accent2: #4dd4ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }

  header { margin-bottom: 28px; }
  h1 {
    font-size: 30px;
    margin: 0 0 6px;
    letter-spacing: -0.5px;
  }
  h1 span { color: var(--accent); }
  .sub { color: var(--dim); font-size: 14px; margin: 0; }

  .status {
    margin-top: 12px;
    font-size: 13px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--dim);
  }
  .status.ok { color: var(--accent2); }
  .status.err { color: var(--accent); }

  section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 18px;
  }
  h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--dim);
    margin: 0 0 14px;
    font-weight: 600;
  }

  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; }
  input, select {
    background: #0a0a0d;
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 14px;
    font-family: inherit;
    min-width: 0;
    width: 130px;
  }
  input:focus, select:focus { outline: 1px solid var(--accent2); }

  button {
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 6px;
    padding: 9px 16px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  button.ghost {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--dim);
    font-weight: 500;
  }

  .beat {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 10px;
    background: #101014;
  }
  .beat-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  .beat-name { font-size: 17px; font-weight: 600; }
  .beat-id {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    color: var(--dim);
  }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 9px 0; }
  .tag {
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 20px;
    background: #1c1c23;
    color: var(--dim);
    border: 1px solid var(--line);
  }
  .tag.bpm { color: var(--accent2); }
  audio { width: 100%; margin-top: 8px; height: 36px; }
  .nofile { font-size: 13px; color: var(--dim); margin-top: 8px; font-style: italic; }

  .empty { color: var(--dim); font-size: 14px; padding: 8px 0; }
  .note { font-size: 12px; color: var(--dim); margin-top: 10px; }

  @media (max-width: 520px) {
    input, select { width: 100%; }
    .field { flex: 1 1 100%; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Beat <span>API</span></h1>
    <p class="sub">Backend service for cataloging beats — search, upload, auto-generated previews.</p>
    <p class="status" id="status">connecting…</p>
  </header>

  <section>
    <h2>Search</h2>
    <div class="row">
      <div class="field">
        <label for="f-genre">Genre</label>
        <select id="f-genre"><option value="">any</option></select>
      </div>
      <div class="field">
        <label for="f-mood">Mood</label>
        <input id="f-mood" placeholder="any">
      </div>
      <div class="field">
        <label for="f-min">Min BPM</label>
        <input id="f-min" type="number" placeholder="any">
      </div>
      <div class="field">
        <label for="f-max">Max BPM</label>
        <input id="f-max" type="number" placeholder="any">
      </div>
      <button onclick="loadBeats()">Apply</button>
      <button class="ghost" onclick="resetFilters()">Reset</button>
    </div>
  </section>

  <section>
    <h2>Add a beat</h2>
    <div class="row">
      <div class="field">
        <label for="n-name">Name</label>
        <input id="n-name" placeholder="melody55">
      </div>
      <div class="field">
        <label for="n-creator">Creator</label>
        <input id="n-creator" placeholder="Ansar">
      </div>
      <div class="field">
        <label for="n-bpm">BPM</label>
        <input id="n-bpm" type="number" placeholder="160">
      </div>
      <div class="field">
        <label for="n-genre">Genre</label>
        <input id="n-genre" placeholder="rage">
      </div>
      <div class="field">
        <label for="n-mood">Mood</label>
        <input id="n-mood" placeholder="dark">
      </div>
      <div class="field">
        <label for="n-file">Audio file</label>
        <input id="n-file" type="file" accept="audio/*">
      </div>
      <button onclick="createBeat()">Upload</button>
    </div>
    <p class="note">The server trims the first 30 seconds into a preview automatically.</p>
  </section>

  <section>
    <h2>Beats <span id="count" style="color:var(--accent2)"></span></h2>
    <div id="list"><p class="empty">loading…</p></div>
  </section>

</div>

<script>
const API = "http://127.0.0.1:8000";

function setStatus(text, cls) {
  const el = document.getElementById("status");
  el.textContent = text;
  el.className = "status " + (cls || "");
}

// Ask the API for beats, with whatever filters are filled in.
async function loadBeats() {
  const params = new URLSearchParams();
  const genre = document.getElementById("f-genre").value.trim();
  const mood  = document.getElementById("f-mood").value.trim();
  const min   = document.getElementById("f-min").value.trim();
  const max   = document.getElementById("f-max").value.trim();
  if (genre) params.append("genre", genre);
  if (mood)  params.append("mood", mood);
  if (min)   params.append("min_bpm", min);
  if (max)   params.append("max_bpm", max);

  const list = document.getElementById("list");
  try {
    const res = await fetch(API + "/beats?" + params.toString());
    if (!res.ok) throw new Error("status " + res.status);
    const beats = await res.json();
    setStatus("connected to " + API, "ok");
    document.getElementById("count").textContent = beats.length;
    render(beats);
  } catch (e) {
    setStatus("cannot reach the API — is the server running?", "err");
    list.innerHTML = '<p class="empty">No connection.</p>';
  }
}

function render(beats) {
  const list = document.getElementById("list");
  if (beats.length === 0) {
    list.innerHTML = '<p class="empty">Nothing matches these filters.</p>';
    return;
  }
  list.innerHTML = beats.map(b => `
    <div class="beat">
      <div class="beat-top">
        <span class="beat-name">${esc(b.name)}</span>
        <span class="beat-id">#${b.id}</span>
      </div>
      <div class="tags">
        <span class="tag">${esc(b.creator)}</span>
        <span class="tag bpm">${b.bpm} BPM</span>
        <span class="tag">${esc(b.genre)}</span>
        <span class="tag">${esc(b.mood)}</span>
      </div>
      <audio controls preload="none" src="${API}/beats/${b.id}/preview"></audio>
    </div>
  `).join("");
}

function esc(s) {
  return String(s).replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
}

// Fill the genre dropdown from /beats/genres
async function loadGenres() {
  try {
    const res = await fetch(API + "/beats/genres");
    const genres = await res.json();
    const sel = document.getElementById("f-genre");
    sel.innerHTML = '<option value="">any</option>';
    genres.sort().forEach(g => {
      const o = document.createElement("option");
      o.value = g; o.textContent = g;
      sel.appendChild(o);
    });
  } catch (e) { /* server down — leave the dropdown empty */ }
}

// Two requests: create the beat, then upload its file.
async function createBeat() {
  const body = {
    name:    document.getElementById("n-name").value.trim(),
    creator: document.getElementById("n-creator").value.trim(),
    bpm:     parseInt(document.getElementById("n-bpm").value, 10),
    genre:   document.getElementById("n-genre").value.trim().toLowerCase(),
    mood:    document.getElementById("n-mood").value.trim().toLowerCase(),
  };
  if (!body.name || !body.creator || !body.bpm || !body.genre || !body.mood) {
    setStatus("fill in every field first", "err");
    return;
  }

  setStatus("creating beat…");
  try {
    const res = await fetch(API + "/beats", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error("create failed: " + res.status);
    const beat = await res.json();

    const fileInput = document.getElementById("n-file");
    if (fileInput.files.length > 0) {
      setStatus("uploading audio…");
      const form = new FormData();
      form.append("file", fileInput.files[0]);
      const up = await fetch(API + "/beats/" + beat.id + "/upload", {
        method: "POST",
        body: form,
      });
      if (!up.ok) throw new Error("upload failed: " + up.status);
    }

    setStatus("added beat #" + beat.id, "ok");
    ["n-name","n-creator","n-bpm","n-genre","n-mood","n-file"].forEach(id => {
      document.getElementById(id).value = "";
    });
    loadGenres();
    loadBeats();
  } catch (e) {
    setStatus(e.message, "err");
  }
}

function resetFilters() {
  ["f-mood","f-min","f-max"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("f-genre").value = "";
  loadBeats();
}

loadGenres();
loadBeats();
</script>
</body>
</html>
